# One fixed PrusaSlicer profile for comparing the treat dispenser's parts (tools/treat-dispenser-views.ts): a generic 0.4 mm nozzle,
# 0.2 mm layers, PETG, the model's print notes (four perimeters), automatic supports. Not a tuned printing profile.
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 250
nozzle_diameter = 0.4
layer_height = 0.2
first_layer_height = 0.2
perimeters = 4
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = gyroid
support_material = 1
support_material_auto = 1
support_material_threshold = 45
support_material_contact_distance = 0.2
filament_diameter = 1.75
filament_density = 1.27
filament_type = PETG
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
use_relative_e_distances = 1
gcode_flavor = marlin2
layer_gcode = G92 E0
