name: Docker integration

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Compose, browser, renderer, and recovery checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build and start Compose services
        run: docker compose up --build -d --wait

      - name: Run browser checks
        run: npm run test:browser

      - name: Run restart and persistence checks
        run: npm run test:restart

      - name: Run renderer geometry checks
        run: npm run test:renderer

      # A fixed-seed sample of every model's parameter space; the nightly Geometry sweep looks much wider with a rotating seed.
      - name: Run geometry sweep (sample)
        run: npm run test:sweep
        env:
          SWEEP_SEED: '1'
          SWEEP_SAMPLES: '2'
          SWEEP_BOUNDARIES: '0'
          SWEEP_CONCURRENCY: '3'
          SWEEP_REPORT: geometry-sweep.md

      - name: Run STL-to-SCAD renderer tests (pinned OpenSCAD image)
        run: npx vitest run tools
        env:
          STL_TO_SCAD_RENDER_TESTS: '1'
          OPENSCAD_RUNNER: docker

      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log 2>&1 || true

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            compose.log
            geometry-sweep.md
            playwright-report/
            test-results/

      - name: Stop Compose services
        if: always()
        run: docker compose down -v --remove-orphans

  slicer:
    # The QR tag's codes, sliced with OrcaSlicer at the smallest module validation allows, for every module style and nozzle; fails
    # if a single module comes out the wrong colour (tools/test-slicer.ts, docs/qr-magnet-tag.md#slicer-check).
    name: QR tag slicer check (OrcaSlicer)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache the OrcaSlicer AppImage
        uses: actions/cache@v4
        with:
          path: ~/.cache/orca-slicer
          key: orca-slicer-${{ hashFiles('tools/install-orca-slicer.sh') }}

      - name: Install OrcaSlicer
        run: echo "ORCA_SLICER=$(tools/install-orca-slicer.sh)" >> "$GITHUB_ENV"

      - name: Pull the pinned renderer image
        run: docker pull "$(npx tsx -e "import { RENDERER_IMAGE } from '@canfactory/server'; console.log(RENDERER_IMAGE)")"

      - name: Run the slicer check
        run: npm run test:slicer
        env:
          SLICER_CONCURRENCY: '3'
          SLICER_ARTIFACTS: slicer-artifacts

      - name: Upload the failing cases (STL, G-code, profiles, picture, report)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slicer-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          path: slicer-artifacts/
