name: Geometry sweep

# Renders every model at the edges of its parameter space and at random settings, and fails on any render failure or float32
# sliver repair (tools/sweep-geometry.ts). The seed rotates every run, so each night looks somewhere new; a failure's report names
# the settings that reproduce it.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Seed (empty for the run number)
        required: false
      samples:
        description: Random settings per model
        required: false
        default: '20'
      model:
        description: Only this model (e.g. litter-shovel)
        required: false

permissions:
  contents: read

concurrency:
  group: geometry-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Boundary and random renders of every model
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pull the pinned renderer image
        run: docker pull "$(npx tsx -e "import { RENDERER_IMAGE } from '@canfactory/server'; console.log(RENDERER_IMAGE)")"

      - name: Run geometry sweep
        run: npm run test:sweep
        env:
          SWEEP_SEED: ${{ inputs.seed || github.run_number }}
          SWEEP_SAMPLES: ${{ inputs.samples || '20' }}
          SWEEP_BOUNDARIES: '1'
          SWEEP_CONCURRENCY: '3'
          SWEEP_REPORT: geometry-sweep.md
          TEST_ONLY: ${{ inputs.model }}

      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-sweep-${{ github.run_id }}
          if-no-files-found: ignore
          path: geometry-sweep.md

  slicer-sweep:
    # The QR tag's slicer check between each style, nozzle and bleed's minimum module and twice it, a different fraction of a step
    # each night: slicers do not get steadily better as modules grow (a module a few lines wide can print hollow), so a pass at the
    # minimum does not prove the sizes above it.
    name: QR tag slicer sweep (OrcaSlicer)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache the OrcaSlicer AppImage
        uses: actions/cache@v4
        with:
          path: ~/.cache/orca-slicer
          key: orca-slicer-${{ hashFiles('tools/install-orca-slicer.sh') }}

      - name: Install OrcaSlicer
        run: echo "ORCA_SLICER=$(tools/install-orca-slicer.sh)" >> "$GITHUB_ENV"

      - name: Pull the pinned renderer image
        run: docker pull "$(npx tsx -e "import { RENDERER_IMAGE } from '@canfactory/server'; console.log(RENDERER_IMAGE)")"

      - name: Run the slicer sweep
        run: npm run test:slicer
        env:
          SLICER_SWEEP: '1'
          SLICER_SWEEP_SEED: ${{ inputs.seed || github.run_number }}
          SLICER_CONCURRENCY: '3'
          SLICER_ARTIFACTS: slicer-artifacts

      - name: Upload the failing cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slicer-sweep-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          path: slicer-artifacts/
