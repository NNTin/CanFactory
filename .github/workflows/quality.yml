name: Quality

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  # @nntin/tinytinkerer-embed comes from GitHub Packages (#152); npm ci needs a token to read it.
  packages: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, lint, contracts, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run quality checks
        run: npm run check

      - name: Build frontend
        run: npm run build

      # #152: with the assistant off or not yet opened, no tinytinkerer runtime is in the startup bundle.
      - name: Check the startup bundle
        run: npm run check:web-bundle
