images:
  web:
    repository: ghcr.io/nntin/canfactory-web
    digest: ""
  api:
    repository: ghcr.io/nntin/canfactory-api
    digest: ""
  worker:
    repository: ghcr.io/nntin/canfactory-worker
    digest: ""
  # KiPrint's MCP server (#152 §6): built and published by NNTin/KiPrint, not by this repository's workflow, so
  # tools/stamp-chart-digests.py leaves it as it is. Set the digest KiPrint's CI publishes to enable `kiprint`.
  kiprint:
    repository: ghcr.io/nntin/kiprint
    digest: ""
imagePullSecrets: []
# Deployments count image pulls toward the progress deadline too; slow links must not mark a rollout failed.
rollout:
  progressDeadlineSeconds: 1800
secrets:
  api: canfactory-api
  worker: canfactory-worker
  release: canfactory-release
  maintenance: canfactory-maintenance
storage:
  endpoint: http://garage.canfactory-data.svc.cluster.local:3900
  region: garage
  catalogueBucket: canfactory-catalogue
  generatedBucket: canfactory-generated
web:
  replicas: 2
  # The embedded assistant (#152), served to the browser as /config.json. Off: no panel, and the assistant's code never loads.
  # On, `edgeBaseUrl` is the tinytinkerer edge (production api.tiny.nntin.xyz, develop api.dev.tiny.nntin.xyz), which the CSP's
  # connect-src then allows; `githubClientId` is tinytinkerer's GitHub OAuth App client id (a public value).
  assistant:
    enabled: false
    edgeBaseUrl: ""
    githubClientId: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
api:
  replicas: 2
  resources:
    requests: {cpu: 200m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
worker:
  replicas: 1
  scratchSize: 1Gi
  resources:
    requests: {cpu: 750m, memory: 2Gi}
    limits: {cpu: "2", memory: 2Gi}
maintenance:
  schedule: "* * * * *"
  suspend: false
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
# The offers service (templates/offers.yaml): Awin feed ingestion, hourly at minute 17. `secret` holds AWIN_DATAFEED_KEY.
offers:
  schedule: "17 * * * *"
  suspend: true
  secret: canfactory-offers
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 500m, memory: 512Mi}
release:
  # Counts image pull time as well as the run: at ~2 Mbit/s a fresh api image takes many minutes.
  activeDeadlineSeconds: 1800
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
# KiPrint (#152 §6, templates/kiprint.yaml): the MCP server the assistant calls through the tinytinkerer edge. Off, nothing is
# rendered. On, it needs images.kiprint.digest and `hostname` (production kiprint.nntin.xyz, preview kiprint-preview.nntin.xyz),
# and these owner-created Secrets in the release namespace: `imagePullSecrets` (the image is private) and `bearerToken`.
kiprint:
  enabled: false
  hostname: ""
  # How long a project lives after its last change (KIPRINT_PROJECT_TTL): 7d, 36h, 30m or seconds.
  projectTtl: 7d
  # Added to the chart-wide imagePullSecrets: a docker-registry Secret for ghcr.io with read:packages.
  imagePullSecrets:
    - name: ghcr-kiprint
  # KIPRINT_BEARER_TOKEN comes from this existing Secret; the chart never holds the token itself.
  bearerToken:
    secret: kiprint-mcp
    key: KIPRINT_BEARER_TOKEN
  # KIPRINT_DATA_DIR. One replica with the Recreate strategy: the volume is ReadWriteOnce, and two servers on one volume
  # would lose updates. Empty storageClassName uses the cluster default; volumeName binds a pre-created PersistentVolume.
  persistence:
    size: 5Gi
    storageClassName: ""
    volumeName: ""
  # The HTTPRoute's parent: the Gateway that routes CanFactory's other hostnames.
  gateway:
    name: canfactory
    namespace: canfactory-edge
    sectionName: http
  # Ingress allowances for namespaces that deny unspecified ingress: the Gateway's pods reach KiPrint, and KiPrint reaches the
  # API Service for GET /api/v1/parts/{id}/layout.
  networkPolicy:
    enabled: true
    gatewayNamespace: canfactory-edge
    gatewayPodLabels:
      app.kubernetes.io/name: traefik
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1536Mi}
