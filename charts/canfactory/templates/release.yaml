apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-release
  labels:
    {{- include "canfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: release
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canfactory
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: release
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: release
          image: {{ printf "%s@%s" .Values.images.api.repository .Values.images.api.digest | quote }}
          command: [node, --import, tsx, tools/maintenance.ts, release]
          securityContext: {{ include "canfactory.security" . | nindent 12 }}
          resources: {{ toYaml .Values.release.resources | nindent 12 }}
          env: {{ include "canfactory.env" (dict "root" . "role" "release") | nindent 12 }}
          volumeMounts:
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 128Mi}
