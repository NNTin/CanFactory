upstream canfactory_api {
    zone canfactory_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:3001 resolve;
}

# The chart's policy (charts/canfactory/templates/web-config.yaml) with the assistant pointed at the develop edge, the one that
# serves localhost (#152). apps/web/src/assistant/csp.test.ts keeps the two in step.
map $uri $content_security_policy {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://api.dev.tiny.nntin.xyz https://api.github.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;

    location /api/ {
        proxy_pass http://canfactory_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $content_security_policy always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $content_security_policy always;
    }
}
